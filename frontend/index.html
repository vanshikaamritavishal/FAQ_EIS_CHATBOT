<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            width: 80%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        #answer {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>FAQ Chatbot</h1>

    <input
        type="text"
        id="question"
        placeholder="Ask a question..."
    />

    <button onclick="askQuestion()">
        Ask
    </button>

    <div id="answer"></div>

    <script src="script.js"></script>

</body>
</html>
